# HTTP 示例；如系统已有 default_server，请先处理配置冲突。
server {
    listen 80 default_server;
    server_name _;
    root /opt/laoshi/current/web;
    index index.html;
    autoindex off;
    server_tokens off;

    include /etc/nginx/snippets/laoshi-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;

    location = /api {
        return 308 https://laoshi.chat$request_uri;
    }

    location ^~ /api/ {
        return 308 https://laoshi.chat$request_uri;
    }

    location ~ /\. {
        deny all;
    }

    # SSG 的 /work/slug/ 对应 /work/slug/index.html，不回退到首页。
    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        try_files $uri =404;
    }

    # 只对带 Vite 内容哈希的静态资源设置长期缓存。
    location ~* ^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/laoshi-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
