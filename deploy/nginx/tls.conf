# 主站与 /api 共用 laoshi.chat 证书；后端仅监听本机 127.0.0.1:8787。
server {
    listen 80;
    server_name laoshi.chat;
    include /etc/nginx/snippets/laoshi-security-headers.conf;
    return 308 https://laoshi.chat$request_uri;
}

server {
    listen 443 ssl;
    server_name laoshi.chat;
    ssl_certificate /etc/nginx/certs/laoshi.chat/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/laoshi.chat/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LaoshiTLS:10m;
    ssl_session_timeout 1d;

    root /opt/laoshi/current/web;
    index index.html;
    autoindex off;
    server_tokens off;
    include /etc/nginx/snippets/laoshi-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    error_page 404 /404.html;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_intercept_errors off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 35s;
        proxy_read_timeout 35s;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.html$ {
        try_files $uri =404;
    }

    location ~* ^/assets/.+-[A-Za-z0-9_-]{8,}\.(?:js|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        try_files $uri =404;
        include /etc/nginx/snippets/laoshi-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
